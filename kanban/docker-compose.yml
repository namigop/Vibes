services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban-postgres
    restart: unless-stopped
    environment:
      # These match backend/internal/config/config.go's defaultDatabaseURL and
      # the credentials the existing `pgdata` volume was initialised with.
      # Changing them here does NOT change an existing volume — Postgres only
      # reads them on first init. Use `docker compose down -v` to reset.
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    ports:
      # Host port is configurable because 5432 is often already taken by a
      # local Postgres install. This published port is only for tools running
      # on the Windows host; containers on this network use 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-kanban}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kanban-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # This is the DSN the backend uses *inside* the compose network. It must
      # match backend/internal/config/config.go's defaultDatabaseURL so that
      # leaving DATABASE_URL unset still connects.
      DATABASE_URL: postgres://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban}@postgres:5432/${POSTGRES_DB:-kanban}?sslmode=disable
      BACKEND_PORT: 8080
      APP_ENV: development
      SEED_DEMO: "true"
      # Development values. See internal/config/config.go: the server refuses to
      # boot with APP_ENV=production while SEED_DEMO is on, while JWT_SECRET is
      # the default, or while DEMO_PASSWORD is the default — because there is no
      # signup flow and every account would share one published password.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
      JWT_TTL: ${JWT_TTL:-24h}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-kanban-demo}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kanban-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
