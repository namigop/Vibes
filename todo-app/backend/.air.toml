root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "internal/store"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "internal", "sql", "migrations"]
  include_ext = ["go", "yaml", "yml", "sql", "toml"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  # Use filesystem polling instead of inotify. Docker Desktop bind mounts on
  # Windows/macOS do not propagate inotify events from the host into the
  # container, so with poll = false air silently never rebuilds. Polling costs
  # a little CPU but makes hot reload work reliably.
  poll = true
  poll_delay = 1000 # milliseconds between filesystem scans
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
