version: "2"
sql:
  - engine: "postgresql"
    queries: "sql"
    schema: "sql/schema.sql"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        # Map Postgres native types onto the plain Go types the rest of the
        # codebase already uses. Without these, sqlc emits pgx's pgtype
        # wrappers (pgtype.UUID / pgtype.Timestamptz), which:
        #   1. break the service layer, which passes uuid.UUID, and
        #   2. serialize to {"Bytes":...,"Valid":true} instead of a plain
        #      UUID string / ISO-8601 timestamp the frontend expects.
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
